name: Build jt2glb.exe

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build CLI release binary
        shell: cmd
        run: cargo build --release -p ferrojt-cli

      - name: Copy ferrojt.exe as jt2glb.exe
        shell: pwsh
        run: |
          $src = "target\release\ferrojt.exe"
          if (-not (Test-Path $src)) {
            Write-Error "Could not find $src"
            exit 1
          }
          Copy-Item $src -Destination "target\release\jt2glb.exe" -Force

      - name: Upload jt2glb.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: jt2glb-windows-x64
          path: target\release\jt2glb.exe
